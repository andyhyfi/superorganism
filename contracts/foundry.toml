[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Long sequences that grow deep trees: FOUNDRY_PROFILE=deep forge test
[profile.deep.invariant]
runs = 32
depth = 500
fail_on_revert = false

[rpc_endpoints]
ink_sepolia = "https://rpc-gel-sepolia.inkonchain.com"
